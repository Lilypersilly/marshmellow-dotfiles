# 1. Control the overall layout to remove hidden gaps
format = "${custom.random_name}$hostname $directory$character"
# (Optional) If you want the > arrow on a new line, use: 
# format = "$username$hostname $directory\n$character"

#[username]
#show_always = true
## Add the pink background here so it starts the pill
#format = '[${custom.random_name}](bg:#F3CBF3 fg:#505950 bold)'

[hostname]
ssh_only = false
# Remove the leading space so it seamlessly fuses with the username
format = '[ ♡](bg:#F3CBF3 fg:#505950)'

[directory]
# Make the folder path (~) match your green-grey instead of the default cyan
style = "bold #505950"
format = '[$path ]($style)'

[character]
# Make the prompt arrow match the theme (and turn red only if a command fails)
success_symbol = '[❯](#505950)'
error_symbol = '[❯](#FF9E9E)'

[custom.random_name]
command = """ bash -c 'names=("meow" "Woof" "GirlyPop" "Nyan" "Yay" "Ilko"); echo "${names[$RANDOM % ${#names[@]}]}"' """
when = "true"
format = "[$output]($style)"
style = "bg:#F3CBF3 fg:#505950 bold"
