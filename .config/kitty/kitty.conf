# Fonts
# font_family      TT2020Base
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        10.0

# Window Layout
window_padding_width 15
hide_window_decorations yes
confirm_os_window_close 0

# Transparency (85% Frosted Pink Glass!)
background_opacity 0.80
dynamic_background_opacity yes

# --- MARSHMELLOW LIGHT MODE COLORS ---
background #FEE4FF
foreground #333933
cursor     #E975CA
cursor_text_color #FEE4FF

selection_background #EF96D9
selection_foreground #333933

# Black (Mapped to your dark charcoal for readability)
color0 #333933
color8 #856D8A
# Red
color1 #DA4453
color9 #DA4453
# Green
color2 #27AE60
color10 #27AE60
# Yellow
color3 #F67400
color11 #F67400
# Blue / Magenta
color4 #BF40A1
color12 #BF40A1
# Pink / Accent
color5 #E975CA
color13 #E975CA
# Cyan / Selection
color6 #1E96B4
color14 #1E96B4
# White (Mapped to darker greys so light-mode text is visible)
color7 #505950
color15 #322A32
text_composition_strategy 2.0 30


# BEGIN_KITTY_FONTS
font_family      family="MesloLGL Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS